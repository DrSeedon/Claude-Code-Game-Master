<script>
// ── SCENE ──
const STEPS = [{"t": "Портал без инструкции", "say": "Стив умер на Земле и очнулся в мире приключенческого аниме-исэкая. Причина смерти и переноса пока неизвестна; загадку не подменяем удобной легендой.", "sub": "Стив: Земля → новый мир · «Причина» пока неизвестна", "x": "«Причина» пока неизвестна", "kind": "isekai", "chapter": "Стив"}, {"t": "Магия вокруг", "say": "Здесь магия обычна: её изучают через практику, учителей, опыты и артефакты. Сам факт, что мир сияет рунами, не выдаёт Стиву сертификат волшебника.", "sub": "Магия распространена · Нужны практика и условия", "x": "Нужны практика и условия", "kind": "isekai", "chapter": "Стив"}, {"t": "С нуля — это с нуля", "say": "Стив начинает человеком первого уровня без способностей, оружия, денег и автоматических сверхбонусов. Это начало истории, а не тайная кнопка победы.", "sub": "Человек · уровень 1 · Без способностей, оружия и денег", "x": "Без способностей, оружия и денег", "kind": "isekai", "chapter": "Стив"}, {"t": "Знание Земли — гипотеза", "say": "Опыт Земли помогает предложить идею и задать хороший вопрос. Но местные материалы, ремесло, законы магии и чужие тайны от этого сами не появляются.", "sub": "Идея ≠ экспертиза · Знание не создаёт ресурсы", "x": "Знание не создаёт ресурсы", "kind": "isekai", "chapter": "Стив"}, {"t": "Рост должен быть заработан", "say": "Сильного врага можно переиграть подготовкой, местностью, союзниками или вып+олненным условием техники. Если преимущества нет, большая разница в силах остаётся настоящей.", "sub": "Подготовка меняет расклад · Сила всё ещё имеет значение", "x": "Сила всё ещё имеет значение", "kind": "isekai", "chapter": "Стив"}, {"t": "Шесть характеристик", "say": "Сила Стива равна десяти, ловкость двенадцати, телосложение десяти. Интеллект четырнадцать, мудрость семь, харизма двенадцать.", "sub": "СИЛ 10 · ЛОВ 12 · ТЕЛ 10 · ИНТ 14 · МДР 7 · ХАР 12", "x": "ИНТ 14 · МДР 7 · ХАР 12", "kind": "stats", "chapter": "d20"}, {"t": "Модификаторы", "say": "Их модификаторы по порядку: ноль, плюс один, ноль, плюс два, минус два и плюс один. Выдающаяся сообразительность не превращает все остальные числа в четырнадцать.", "sub": "0 · +1 · 0 · +2 · −2 · +1 · Модификатор привязан к характеристике", "x": "Модификатор привязан к характеристике", "kind": "stats", "chapter": "d20"}, {"t": "Основа — знакомая система", "say": "Для проверок, спасбросков, владения, класса защиты и урона используется основа Дэ-энд-Ди с двадцатигранным кубиком. Необычный эффект требует ещё и собственного договора.", "sub": "d20 · saves · proficiency · AC · Особые эффекты имеют контракт", "x": "Особые эффекты имеют контракт", "kind": "dice", "chapter": "d20"}, {"t": "Кубик нужен не всегда", "say": "Бросок нужен, когда исход действительно неопределён и важен. Если установленное правило уже гарантирует результат, лишний кубик лишь делает вид, что он принял решение.", "sub": "Бросок ↔ значимая неопределённость · Гарантированный исход не бросается", "x": "Гарантированный исход не бросается", "kind": "dice", "chapter": "d20"}, {"t": "Сложность объявляется заранее", "say": "Ориентиры сложности: десять для лёгкого, тринадцать для умеренного, шестнадцать для трудного и двадцать для исключительного. Ставки и модификатор называют до броска.", "sub": "DC 10 · 13 · 16 · 20 · Сложность и ставки до броска", "x": "Сложность и ставки до броска", "kind": "dice", "chapter": "d20"}, {"t": "Преимущество и пределы", "say": "При преимуществе бросаем два двадцатигранных кубика и выбираем больший результат, при помехе меньший. Натуральная двадцатка может быть эффектной, но не отменит невозможность или условие техники.", "sub": "Преимущество / помеха · 20 не отменяет границы", "x": "20 не отменяет границы", "kind": "dice", "chapter": "d20"}, {"t": "Пример — только пример", "say": "На схеме выпадает пятнадцать против сложности тринадцать , это условная иллюстрация проверки, не бросок кампании и не результат действия Стива.", "sub": "Пример: 15 против DC 13 · Это не бросок кампании", "x": "Это не бросок кампании", "kind": "dice", "chapter": "d20"}, {"t": "Предложение ещё не способность", "say": "Игрок может предложить технику обычными словами. До согласования, записи и освоения это идея, а не разрешение внезапно применить её в бою.", "sub": "Идея → согласование → освоение · Предложение не даёт эффект", "x": "Предложение не даёт эффект", "kind": "contract", "chapter": "Контракт"}, {"t": "Контракт: источник и домен", "say": "Сначала фиксируются источник, название, версия и тема, затем эффект и область воздействия: тело, энергия, материя, восприятие или ясно названная другая область.", "sub": "Источник · версия · эффект · Домен указывает, что затронуто", "x": "Домен указывает, что затронуто", "kind": "contract", "chapter": "Контракт"}, {"t": "Контракт: цель и досягаемость", "say": "Нужно определить, как выбирается цель, кто допустим и какова дальность. Формулировка всё вокруг сама по себе не измеряет область и не выбирает противников.", "sub": "Цель · выбор · дальность · Область требует границ", "x": "Область требует границ", "kind": "contract", "chapter": "Контракт"}, {"t": "Контракт: время", "say": "Записываются активация, подготовка, задержка, длительность и то, что прерывает эффект. Без этого нельзя честно решить, успела ли техника сработать.", "sub": "Активация → подготовка → эффект · Длительность · прерывание", "x": "Длительность · прерывание", "kind": "contract", "chapter": "Контракт"}, {"t": "Контракт: цена и мощность", "say": "Отдельно задаются стоимость ресурса, предел мощности и восстановление. Большой запас энергии сам по себе не означает сильный выброс или точный контроль.", "sub": "Стоимость · предел · восстановление · Запас, мощность и контроль различны", "x": "Запас, мощность и контроль различны", "kind": "contract", "chapter": "Контракт"}, {"t": "Контракт: защита и провал", "say": "У договора есть конкретные ограничения, защиты и условия неудачи. До первой серьёзной траты практические границы должны быть понятны игроку.", "sub": "Ограничения · контрмеры · провал · Условия известны до траты", "x": "Условия известны до траты", "kind": "contract", "chapter": "Контракт"}, {"t": "Мастерство тоже часть договора", "say": "Записываются требования получения и текущая степень освоения. Косметическое свечение может быть бесплатным, пока оно не расширяет механический эффект.", "sub": "Получение → освоение · Новичок не равен мастеру", "x": "Новичок не равен мастеру", "kind": "contract", "chapter": "Контракт"}, {"t": "В бою нет тихих переписей", "say": "Подтверждённый договор нельзя незаметно изменить посреди боя. Уточнение становится записанным прецедентом, а новая версия требует явного согласия игрока.", "sub": "Версия 1 → прецедент или версия 2 · Изменения согласуются явно", "x": "Изменения согласуются явно", "kind": "contract", "chapter": "Контракт"}, {"t": "Не всякая идея наносит урон", "say": "Утилита, контроль, превращение и необычное условие победы не обязаны становиться уроном или расходом маны. Баланс зависит от доступа, подготовки, риска и ответа мира.", "sub": "Утилита · контроль · превращение · Цена — не обязательно урон или мана", "x": "Цена — не обязательно урон или мана", "kind": "contract", "chapter": "Контракт"}, {"t": "Порядок столкновения", "say": "Сначала проверяются возможность и подготовка, затем выбор цели и контакт. П+осле этого , особые взаимодействия, остаточная защита, рана или иной эффект, а потом восстановление.", "sub": "Подготовка → цель → контакт · Взаимодействие → защита → последствия", "x": "Взаимодействие → защита → последствия", "kind": "conflict", "chapter": "Слои"}, {"t": "Автоматический исход должен подходить", "say": "Автоматический бой применим лишь тогда, когда его модель попадания, урона и защиты описывает установленную технику. Иначе необычный эффект разрешают явно и по поддерживаемым правилам.", "sub": "Модель удара должна совпасть · Необычный эффект разбирается отдельно", "x": "Необычный эффект разбирается отдельно", "kind": "conflict", "chapter": "Слои"}, {"t": "Защита имеет область", "say": "Отражение снаряда может остановить снаряд, но не обязано отражать яд, обвал крыши или проклятие по расписанию. Защита работает только в описанном домене.", "sub": "Снаряд ≠ яд ≠ обвал ≠ проклятие · У каждой защиты свой домен", "x": "У каждой защиты свой домен", "kind": "conflict", "chapter": "Слои"}, {"t": "Источник и контроллер — разные роли", "say": "При отражении или краже эффекта отдельно отмечаются исходный источник, текущий контроллер, цель и преобразованное действие. Иначе причинность теряется быстрее, чем снаряд.", "sub": "Источник → контроллер → цель · После преобразования эффект уточняется", "x": "После преобразования эффект уточняется", "kind": "conflict", "chapter": "Слои"}, {"t": "Громкие слова не решают спор", "say": "Абсолютный, бесконечный и неблокируемый не заменяют проверку области, времени активации и исключений. При споре неизвестное раскрывают до того, как игрок заплатит ресурсом.", "sub": "Область · время · исключения · Неизвестный спор — до траты", "x": "Неизвестный спор — до траты", "kind": "conflict", "chapter": "Слои"}, {"t": "Прецедент сохраняет честность", "say": "Для неизвестного взаимодействия стороны заранее согласуют узкое решение и сохраняют его. Так одно и то же правило не меняется только ради спасения игрока или персонажа ведущего.", "sub": "Неизвестное → согласованный ruling · Решение сохраняется", "x": "Решение сохраняется", "kind": "conflict", "chapter": "Слои"}, {"t": "Перемотка требует настоящей истории", "say": "Откат времени требует записанных снимков состояния и правил памяти, ресурсов, существ и событий. Движок не достраивает отсутствующее прошлое как точную всемогущую симуляцию.", "sub": "Snapshot + правила памяти и цены · Нет записи — нет точного отката", "x": "Нет записи — нет точного отката", "kind": "conflict", "chapter": "Слои"}, {"t": "Здоровье не равно анатомии", "say": "Очки здоровья остаются внутри системы. В обычном рассказе не появляются полоски и числовое здоровье врага: называются фактические ушибы, раны и способность продолжать.", "sub": "HP остаются внутренней механикой · Рассказ описывает реальное состояние", "x": "Рассказ описывает реальное состояние", "kind": "condition", "chapter": "Состояние"}, {"t": "Последствия привязаны к травме", "say": "Заметную рану и её функцию записывают в состояние мира. Раненая нога может ограничить движение даже при большом остатке очков здоровья.", "sub": "Рана → конкретное последствие · Например: нога ограничивает движение", "x": "Например: нога ограничивает движение", "kind": "condition", "chapter": "Состояние"}, {"t": "Ноль не означает мгновенную смерть", "say": "Ноль здоровья обычно означает, что персонаж больше не может продолжать. Обычное вычитание очков не отрывает конечности; смертельная травма требует установленного основания.", "sub": "0 HP → не может продолжать · Смерть требует отдельного основания", "x": "Смерть требует отдельного основания", "kind": "condition", "chapter": "Состояние"}, {"t": "Мана, усталость, рана — отдельно", "say": "Ману, усталость и телесные повреждения отслеживают независимо. Потраченная мана автоматически не становится раной, а закрытая рана не возвращает выносливость.", "sub": "Мана ≠ усталость ≠ ранение · Один ресурс не подменяет другой", "x": "Один ресурс не подменяет другой", "kind": "condition", "chapter": "Состояние"}, {"t": "Сон не отменяет лечение", "say": "Отдых, лечение и естественное восстановление имеют разные условия. Обычный сон сам по себе не стирает серьёзную травму и её последствия.", "sub": "Сон → отдых · Серьёзная рана требует условий лечения", "x": "Серьёзная рана требует условий лечения", "kind": "condition", "chapter": "Состояние"}, {"t": "Опыт дают за вклад в приключение", "say": "Опыт возможен за бой, задание, полезную практику, учёбу, ремесло, открытие, исследование, социальное достижение и преодолённую опасность.", "sub": "Бой · дело · учёба · открытие · Исследование · общение · опасность", "x": "Исследование · общение · опасность", "kind": "xp", "chapter": "XP"}, {"t": "Небольшая практика", "say": "Завершённая полезная практика или повседневное обучение обычно приносит от одного до трёх очков опыта , не за сообщение, а за завершённую деятельность.", "sub": "Практика: 1–3 XP · Засчитывается завершённое действие", "x": "Засчитывается завершённое действие", "kind": "xp", "chapter": "XP"}, {"t": "Значимое занятие", "say": "Содержательная тренировка, открытие или умеренное задание обычно стоят от пяти до пятнадцати очков. Повторение знакомой простой работы даёт убывающую отдачу.", "sub": "Заметная работа: 5–15 XP · Повтор простого даёт меньше", "x": "Повтор простого даёт меньше", "kind": "xp", "chapter": "XP"}, {"t": "Крупное достижение", "say": "Крупное достижение обычно приносит от двадцати до пятидесяти очков; исключительное может дать больше при ясном обосновании. Темп прогресса можно обсуждать открыто.", "sub": "Большое достижение: 20–50 XP · Исключения требуют причины", "x": "Исключения требуют причины", "kind": "xp", "chapter": "XP"}, {"t": "Награда существа уже уменьшена", "say": "Награда за существо равна десятой части обычной награды Дэ-энд-Ди, с округлением вниз и минимумом одно очко за настоящую наградуемую встречу. Хранится уже уменьшенное число.", "sub": "XP существа: 1/10 · минимум 1 · Уменьшать второй раз нельзя", "x": "Уменьшать второй раз нельзя", "kind": "xp", "chapter": "XP"}, {"t": "Одно достижение — одна выплата", "say": "Награда квеста платится один раз, как и настроенная выплата за существо. Нельзя снова наградить тем же событием; отдельная тренировка остаётся отдельным результатом.", "sub": "Награда квеста: один раз · Не дублировать одно событие", "x": "Не дублировать одно событие", "kind": "xp", "chapter": "XP"}, {"t": "Помощь армии — не весь её опыт", "say": "Для массового боя учитывается реальный вклад Стива, а не суммарные убийства союзников. Фиксированная оценка в итоговом отчёте боя сама по себе не является выплатой.", "sub": "Массовый бой → личный вклад · Чужие победы не становятся его XP", "x": "Чужие победы не становятся его XP", "kind": "xp", "chapter": "XP"}, {"t": "Порог первого уровня", "say": "Для второго уровня нужно триста общего опыта, для третьего девятьсот, для четвёртого две тысячи семьсот, для пятого шесть тысяч пятьсот; дальше продолжается таблица Дэ-энд-Ди.", "sub": "Уровни: 300 · 900 · 2 700 · 6 500 XP · Дальше — таблица D&D", "x": "Дальше — таблица D&D", "kind": "growth", "chapter": "Рост"}, {"t": "Здоровье новичка растёт по правилу кампании", "say": "Пока Стив новичок, следующий уровень добавляет пять плюс модификатор телосложения очков максимального здоровья, минимум одно. При его телосложении прибавка равна пяти.", "sub": "Новичок: +5 + модификатор ТЕЛ · Стив: +5 max HP", "x": "Стив: +5 max HP", "kind": "growth", "chapter": "Рост"}, {"t": "Владение следует уровню", "say": "Бонус владения следует уровневой таблице. Но сам уровень не выдумывает неосвоенную магию, классную особенность или м+астерство в навыке, которым Стив не занимался.", "sub": "Уровень → бонус владения · Магия и навык требуют освоения", "x": "Магия и навык требуют освоения", "kind": "growth", "chapter": "Рост"}, {"t": "Навык растёт через источник", "say": "Практика, учитель, книга и испытание могут развивать конкретный навык; заслуженный бонус и его источник записывают. Общий уровень не делает неиспользуемое мастерским.", "sub": "Практика · наставник · книга · испытание · У навыка есть источник роста", "x": "У навыка есть источник роста", "kind": "growth", "chapter": "Рост"}, {"t": "Четыре ступени освоения", "say": "Для каждой техники различаются состояния: не изучена, новичок, освоена на практике и мастер. Прорыв требует уже заработанного условия; громкий крик не служит подготовкой.", "sub": "Не изучена → новичок → практика → мастер · Прорыв требует предпосылки", "x": "Прорыв требует предпосылки", "kind": "growth", "chapter": "Рост"}, {"t": "Три магических показателя", "say": "Запас маны, контроль и предельная мощность , разные величины. Рост каждой требует собственной записанной причины, а большой бак не превращается в точный луч.", "sub": "Запас · контроль · мощность · Каждый растёт отдельно", "x": "Каждый растёт отдельно", "kind": "growth", "chapter": "Рост"}, {"t": "Ранг гильдии не уровень", "say": "Ранг гильдии описывает профессиональную репутацию отдельно от уровня и м+астерства техник. Он может открыть работу, но не подменяет личную подготовку.", "sub": "Уровень ≠ м+астерство ≠ ранг · Статус — отдельная шкала", "x": "Статус — отдельная шкала", "kind": "growth", "chapter": "Рост"}, {"t": "В мире соседствуют эпохи", "say": "В мире сосуществуют ранний порох, револьверы и винтовки под патрон, а также магическая инженерия. Доступность, боеприпасы и свойства оружия задаются отдельно.", "sub": "Мушкет · револьвер · винтовка · магитех · Доступность задаётся отдельно", "x": "Доступность задаётся отдельно", "kind": "combat", "chapter": "Бой"}, {"t": "Модуль не вооружает Стива", "say": "Сам факт, что в кампании есть огнестрельный модуль, не выдаёт Стиву оружие и владение стрельбой. Технологии мира не являются его инвентарём.", "sub": "Модуль ≠ оружие в руках · У Стива нет стартового оружия", "x": "У Стива нет стартового оружия", "kind": "combat", "chapter": "Бой"}, {"t": "Бронепробитие имеет доли", "say": "Если пробитие выше защиты, проходит весь урон; выше половины защиты , половина; иначе , четверть. Это сравнение чисел, а не универсальное свойство любой атаки.", "sub": "Пробитие > защита: весь урон · > половины: 1/2 · иначе: 1/4", "x": "> половины: 1/2 · иначе: 1/4", "kind": "combat", "chapter": "Бой"}, {"t": "Крит и укрытие", "say": "Критический успех удваивает кости урона. Укрытие влияет на попадание по своим правилам; ни крит, ни кинематографичный эффект не стирают контракт способности.", "sub": "Крит: кости урона ×2 · Укрытие учитывается отдельно", "x": "Укрытие учитывается отдельно", "kind": "combat", "chapter": "Бой"}, {"t": "Боеприпасы имеют состояние", "say": "Боезапас, заряженные выстрелы и перезарядку отслеживают ажи преследуют собственные цели и меняются со временем. Они не ждут героя в строю и не превращаются в одинаковые автоматы с поручениями.", "sub": "Стив ↔ NPC со своими планами · Мир действует между решениями", "x": "Мир действует между решениями", "kind": "travel", "chapter": "Мир"}, {"t": "Время здесь настроено отдельно", "say": "Год состоит из двенадцати месяцев по тридцать дней, а неделя , из семи названных дней. Десять медных равны одной серебр+яной, а десять серебр+яных одной золотой.", "sub": "12 × 30 дней · неделя 7 дней · 10 меди = 1 серебро · 10 серебра = 1 золото", "x": "10 меди = 1 серебро · 10 серебра = 1 золото", "kind": "travel", "chapter": "Мир"}, {"t": "Игрок выбирает за Стива", "say": "В интерактивном режиме игрок определяет действия, слова, покупки, отношения и развитие Стива. Ведущий описывает мир и управляет неигровыми персонажами.", "sub": "Игрок → выборы Стива · Ведущий → мир и NPC", "x": "Ведущий → мир и NPC", "kind": "agency", "chapter": "Агентность"}, {"t": "Состояние записывается до рассказа", "say": "Правдивое состояние кампании сохраняется в графе мира до того, как ведущий расскажет последствия. Слова без записанного механического эффекта не меняют мир сами по себе.", "sub": "Действие → запись → повествование · Один источник состояния", "x": "Один источник состояния", "kind": "agency", "chapter": "Агентность"}, {"t": "Истина и знание персонажа разделены", "say": "Ведущий может знать больше героя, но Стив действует только исходя из добытых им подсказок и опыта. Тайна остаётся неизвестной, пока история не даст к ней доступ.", "sub": "Правда мира ≠ знание Стива · Тайны открываются через улики", "x": "Тайны открываются через улики", "kind": "agency", "chapter": "Агентность"}, {"t": "Договоры одинаковы для всех", "say": "Те же границы способностей и ресурсов действуют для персонажей ведущего и игрока. Это удерживает конфликт честным, даже когда эффект выглядит эффектно.", "sub": "Один контракт → обе стороны · Правило не меняется по роли", "x":
