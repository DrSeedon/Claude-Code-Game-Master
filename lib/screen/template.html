<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}}</title>
<style>
{{THEME_CSS}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;color:var(--text);font-family:var(--font)}
body{background:var(--bg)}
.bg{position:fixed;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.2s ease}.bg.on{opacity:1}
#shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent 18%,transparent 70%,rgba(0,0,0,.72));pointer-events:none}
#app{transition:opacity .45s ease,transform .45s ease;position:relative;height:100vh;display:grid;grid-template-rows:auto 1fr auto auto;gap:1vh;padding:1.4vh 1.6vw}
.swapping #app{opacity:0;transform:translateY(10px) scale(.995)}
.glass{background:rgba(var(--panel-rgb),.62);border:1px solid rgba(var(--line),.35);border-radius:var(--radius);backdrop-filter:blur(6px)}
header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(var(--line),.35);padding-bottom:.6vh}
.kicker{letter-spacing:.35em;color:var(--accent);font-size:max(1.3vh,12px)}
.place{text-align:right;font-size:max(1.9vh,14px)}.place small{display:block;color:var(--muted);font-size:.8em}
#live{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:#e25b4b;margin-right:.6em;vertical-align:middle;transition:background .3s}
#live.on{background:#6fcf7f;box-shadow:0 0 .8em #6fcf7f}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.2vw;min-height:0;transition:opacity .4s}
.wrap{position:relative;min-height:0;display:grid}
.story{padding:1.4vh 1.5vw;overflow:hidden;font-size:max(1.85vh,15px);line-height:1.42;column-count:2;column-gap:2vw;scroll-behavior:smooth;min-height:0}
.story h1{column-span:all;margin:0 0 .35em;font-size:2.2em;letter-spacing:var(--spacing);color:var(--accent);font-weight:600}
.story h2{margin:1em 0 .3em;font-size:1.1em;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border-bottom:1px solid rgba(var(--line),.35);break-after:avoid}
.story p{margin:.45em 0;break-inside:avoid}.story .lead{font-style:italic}.story b{color:var(--accent2)}
.story>*{animation:rise .7s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pager{position:absolute;right:1.2vw;bottom:1vh;display:flex;gap:.4em;align-items:center;font-size:max(1.6vh,13px);background:rgba(var(--panel-rgb),.9);border:1px solid var(--accent);border-radius:99px;padding:.15em .5em}
.pager button{font:inherit;color:var(--accent);background:none;border:0;cursor:pointer;padding:.1em .6em;font-size:1.2em}
.side{display:flex;flex-direction:column;gap:1vh;padding:1vh 1vw;overflow:auto;min-height:0;font-size:max(1.55vh,12px)}
.hero{border:1px solid rgba(var(--line),.3);border-radius:calc(var(--radius) * .7);padding:.6vh .8vw;background:rgba(255,255,255,.03);animation:rise .6s both}
.hero h3{margin:0;color:var(--accent);font-size:1.3em}.sub{color:var(--muted);font-size:.9em;margin:.05em 0 .4em}
.hp{display:flex;align-items:center;gap:.6em}.hp .bar{flex:1;height:.65em;background:rgba(0,0,0,.45);border-radius:99px;overflow:hidden}
.hp .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b8442f,#e6803a);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.abs{display:grid;grid-template-columns:repeat(6,1fr);gap:.35em;margin:.5em 0}
.ab{text-align:center;border:1px solid rgba(var(--line),.3);border-radius:8px;padding:.2em 0;background:rgba(0,0,0,.3)}
.ab em{display:block;font-style:normal;font-size:.68em;color:var(--muted);letter-spacing:.1em}.ab b{font-size:1.3em}.ab u{display:block;text-decoration:none;color:var(--accent);font-size:.85em}
.chips{display:flex;flex-wrap:wrap;gap:.3em}.chip{border:1px solid rgba(var(--line),.35);border-radius:99px;padding:.08em .6em;background:rgba(0,0,0,.28);font-size:.92em;white-space:nowrap}.chip b{color:var(--accent)}
.box{border:1px solid rgba(var(--line),.3);border-radius:calc(var(--radius) * .7);padding:.6vh .8vw;animation:rise .6s both}
.box h5{margin:0 0 .35em;color:var(--accent);letter-spacing:.2em;font-size:.85em}
.bar-row{display:grid;grid-template-columns:1fr 1fr 2em;gap:.5em;align-items:center;margin:.15em 0}.bar-row>div{height:.45em;background:rgba(0,0,0,.45);border-radius:99px;overflow:hidden}
.bar-row i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .9s}.bar-row b{color:var(--accent);text-align:right}
.steps{display:flex;gap:.3em}.step{flex:1;text-align:center;border:1px solid rgba(var(--line),.3);border-radius:8px;padding:.3em .1em;color:var(--muted);font-size:.78em;line-height:1.15}
.step.cur{background:rgba(var(--line),.22);color:var(--text);border-color:var(--accent)}
.quest-row{margin:.2em 0}.quest-row small{color:var(--muted)}
.flash{animation:flash 1.1s}@keyframes flash{0%{text-shadow:0 0 0 transparent;color:#fff}30%{text-shadow:0 0 .9em var(--accent);color:#fff}100%{text-shadow:none}}
#feed{padding:.7vh 1vw;display:flex;gap:1vw;align-items:stretch;height:13vh;overflow:hidden;font-size:max(1.55vh,12px)}
#feed h6{margin:0;color:var(--accent);letter-spacing:.22em;font-size:.8em;white-space:nowrap;writing-mode:vertical-rl;transform:rotate(180deg)}
#feedlist{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:.15em;overflow:hidden}
.fi{display:flex;gap:.6em;align-items:baseline;animation:slide .5s both;color:var(--muted)}.fi:last-child{color:var(--text)}
.fi .ic{width:1.5em;text-align:center}.fi.roll .t{color:var(--accent2)}.fi.save .t{color:var(--muted);font-style:italic}
@keyframes slide{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.dice{display:inline-block;animation:tumble .9s ease-out both}
@keyframes tumble{0%{transform:rotate(0) scale(.4);opacity:0}60%{transform:rotate(540deg) scale(1.25);opacity:1}100%{transform:rotate(720deg) scale(1)}}
.think .dots::after{content:"";animation:dots 1.2s steps(4) infinite}@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
footer{padding:1vh 1.2vw;display:grid;gap:.8vh}
.qrow{display:flex;align-items:center;gap:1vw}.q{color:var(--accent);font-size:max(2vh,15px);white-space:nowrap}
.opts{display:flex;gap:.7vw;flex:1}
.opt{flex:1;font:inherit;font-size:max(1.8vh,14px);color:var(--text);text-align:left;background:rgba(var(--line),.08);border:1px solid rgba(var(--line),.35);border-radius:calc(var(--radius) * .7);padding:.6vh .8vw;cursor:pointer;transition:.15s;animation:rise .5s both}
.opt:hover{background:rgba(var(--line),.25);border-color:var(--accent);transform:translateY(-1px)}.opt i{font-style:normal;color:var(--accent);font-weight:700;margin-right:.5em}
body.waiting .opt{opacity:.45;pointer-events:none}
.irow{display:flex;gap:.6vw;align-items:center}
.who{display:flex;gap:.3em}.who button{font:inherit;font-size:max(1.6vh,13px);color:var(--muted);background:none;border:1px solid rgba(var(--line),.35);border-radius:99px;padding:.2em .8em;cursor:pointer}
.who button.on{color:var(--text);background:rgba(var(--line),.25);border-color:var(--accent)}
#txt{flex:1;font:inherit;font-size:max(1.8vh,14px);color:var(--text);background:rgba(0,0,0,.35);border:1px solid rgba(var(--line),.35);border-radius:calc(var(--radius) * .7);padding:.5vh .8vw}
#txt::placeholder{color:var(--muted)}
.btn{font:inherit;font-size:max(1.7vh,13px);color:var(--text);background:rgba(var(--line),.15);border:1px solid var(--accent);border-radius:calc(var(--radius) * .7);padding:.5vh 1vw;cursor:pointer}
.btn:hover{background:rgba(var(--line),.35)}
#mic{width:3.4em;height:3.4em;border-radius:50%;padding:0;font-size:max(1.8vh,14px)}
#mic.rec{background:#c0392b;border-color:#ff8a7a;animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 .6em rgba(192,57,43,0)}0%{box-shadow:0 0 0 0 rgba(192,57,43,.7)}}
#mic.busy{opacity:.6}
#say{position:fixed;left:50%;bottom:22vh;transform:translateX(-50%);min-width:34vw;max-width:60vw;padding:1.2vh 1.4vw;z-index:9;display:none;animation:rise .35s both}
#say.on{display:block}#say .tx{font-size:max(2.2vh,16px)}#say .cd{height:.35em;background:rgba(0,0,0,.45);border-radius:99px;margin:.8vh 0;overflow:hidden}
#say .cd i{display:block;height:100%;width:100%;background:var(--accent)}
#saypause{display:none;color:var(--muted);font-size:max(1.5vh,12px);margin:-.3vh 0 .8vh}#say.paused #saypause{display:block}#say.paused .cd i{opacity:.45}
#say input{width:100%;font:inherit;font-size:max(2vh,15px);color:var(--text);background:rgba(0,0,0,.4);border:1px solid var(--accent);border-radius:8px;padding:.5vh .8vw;display:none}
#say .acts{display:flex;gap:.6vw}
#pic,#caps{position:fixed;top:1.2vh;z-index:7;font:inherit;font-size:max(1.5vh,12px);color:var(--text);background:rgba(var(--panel-rgb),.85);border:1px solid var(--accent);border-radius:99px;padding:.3em 1.1em;cursor:pointer}
#pic{left:50%;transform:translateX(-50%)}#caps{left:calc(50% + 9em);display:none}
body.clear #caps{display:block}
body.clear main,body.clear #feed,body.clear footer{opacity:0;pointer-events:none}
#feed,footer,main{transition:opacity .4s}
#stage{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;display:none;container-type:inline-size;z-index:4}
body.clear #stage{display:block}#stage img{width:100%;height:100%;display:block}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#lines line{stroke:var(--accent);stroke-width:1.5}#lines circle{fill:var(--accent)}
.zone{position:absolute;display:flex;gap:.8cqw}#z-tl{left:1.5cqw;top:1.8cqw;width:56cqw;flex-direction:row;align-items:flex-start}
#z-tr{right:1.5cqw;top:1.8cqw;width:25cqw;flex-direction:column}#z-bottom{left:1.5cqw;right:1.5cqw;bottom:1.5cqw;align-items:flex-end}
.cap{flex:1 1 0;min-width:0;background:rgba(var(--panel-rgb),.78);border:1px solid rgba(var(--line),.55);border-radius:.5cqw;padding:.5cqw .8cqw;font-size:1.05cqw;line-height:1.3;animation:rise .5s both}
.cap b{display:block;color:var(--accent);letter-spacing:.05em}.cap small{color:var(--muted);font-size:.92em}
body.nocaps .zone,body.nocaps #lines{display:none}
#toast{position:fixed;bottom:15vh;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);border:1px solid var(--accent);padding:.5em 1em;border-radius:8px;opacity:0;transition:.3s;pointer-events:none;z-index:10}#toast.on{opacity:1}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(var(--line),.4);border-radius:8px}
</style></head>
<body data-token="{{TOKEN}}">
<div class="bg" id="bgA"></div><div class="bg" id="bgB"></div><div id="shade"></div>
<button id="pic"></button><button id="caps"></button>
<div id="stage"><img id="art" alt=""><svg id="lines"></svg><div class="zone" id="z-tl"></div><div class="zone" id="z-tr"></div><div class="zone" id="z-bottom"></div></div>
<div id="say" class="glass"><div class="tx" id="saytx"></div><input id="sayin"><div class="cd"><i id="saycd"></i></div><div id="saypause"></div><div class="acts"><button class="btn" id="saygo"></button><button class="btn" id="sayedit"></button><button class="btn" id="saycancel"></button></div></div>
<div id="toast"></div>
<div id="app">
  <header><div class="kicker"><span id="live"></span><span id="kick"></span></div><div class="place"><span id="place"></span><small id="date"></small></div></header>
  <main>
    <div class="wrap"><article class="story glass" id="story"></article><div class="pager"><button id="prev">◀</button><span id="pg">1/1</span><button id="next">▶</button></div></div>
    <aside class="side glass" id="side"></aside>
  </main>
  <section id="feed" class="glass"><h6 id="feedh"></h6><div id="feedlist"></div></section>
  <footer class="glass">
    <div class="qrow"><div class="q" id="q"></div><div class="opts" id="opts"></div></div>
    <div class="irow"><div class="who" id="who"></div><input id="txt" autocomplete="off"><button class="btn" id="send"></button><button class="btn" id="mic">🎤</button></div>
  </footer>
</div>
<script>
window.onerror=(m,u,l)=>{document.body.setAttribute('data-err',m+' @'+l)};
const TOKEN=document.body.dataset.token, $=id=>document.getElementById(id);
const I18N={
 ru:{pic:'🖼 Картина',picBack:'📖 Вернуть текст',caps:'Подписи',on:'вкл',off:'выкл',feed:'ХОД МАСТЕРА',think:'Мастер думает',ph:'Своё действие: что говорите или делаете…',send:'Отправить',sendNow:'Отправить сейчас',edit:'Изменить',cancel:'Отмена',quests:'ЗАДАНИЯ',all:'Оба',sent:'Отправлено: ',fail:'Не отправилось: ',noMic:'Нет доступа к микрофону',speak:'Говорите, нажмите ещё раз, чтобы закончить',short:'Слишком коротко, скажите ещё раз',silence:'Тишина: ничего не услышал',notUnderstood:'Не распознал',noNet:'Нет связи с распознаванием',lvl:'ур.',ac:'КЗ',mic:'Сказать голосом',paused:'Пауза: пока мышь над панелью или идёт правка',abil:['СИЛ','ЛОВ','ТЕЛ','ИНТ','МДР','ХАР']},
 en:{pic:'🖼 Picture',picBack:'📖 Back to text',caps:'Captions',on:'on',off:'off',feed:"MASTER'S WORK",think:'The Master is thinking',ph:'Your own action: what do you say or do…',send:'Send',sendNow:'Send now',edit:'Edit',cancel:'Cancel',quests:'QUESTS',all:'Everyone',sent:'Sent: ',fail:'Could not send: ',noMic:'No microphone access',speak:'Speak, press again to finish',short:'Too short, try again',silence:'Silence: heard nothing',notUnderstood:'Could not understand',noNet:'No connection to the speech service',lvl:'lvl',ac:'AC',mic:'Speak',paused:'Paused while the mouse is over this panel or you are editing',abil:['STR','DEX','CON','INT','WIS','CHA']}};
let L=I18N.en;const t=k=>L[k];
function applyLang(lang){L=I18N[lang]||I18N.en;document.documentElement.lang=lang||'en';
 $('feedh').textContent=t('feed');$('txt').placeholder=t('ph');$('send').textContent=t('send');$('saygo').textContent=t('sendNow');$('sayedit').textContent=t('edit');$('saycancel').textContent=t('cancel');$('mic').title=t('mic');$('saypause').textContent=t('paused');setPicText();setCapsText()}
const S={actId:null,build:null,lang:'en',turnId:null,feedLast:0,who:'',waiting:false,heroes:{},panels:'',views:null};
try{S.who=localStorage.getItem('who')||''}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mod=v=>{const m=Math.floor((v-10)/2);return m>=0?'+'+m:'−'+(-m)};
const ABIL_KEYS=['str','dex','con','int','wis','cha'];const ABIL=()=>ABIL_KEYS.map((k,i)=>[k,t('abil')[i]]);
let labels={};
const skillName=k=>labels[k]||(k.replace(/_/g,' ').replace(/^./,c=>c.toUpperCase()));
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function setText(el,v){v=String(v);if(el.textContent!==v){el.textContent=v;el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}}

// ---- act: theme, background, header, captions (swapped in place, no new window) ----
function applyTheme(t){if(!t)return;const r=document.documentElement.style,m={'--bg':t.bg,'--panel':t.panel,'--panel-rgb':t.panel_rgb,'--text':t.text,'--muted':t.muted,'--accent':t.accent,'--accent2':t.accent2,'--line':t.line,'--radius':t.radius,'--font':t.font,'--spacing':t.heading_spacing};
  for(const k in m)if(m[k])r.setProperty(k,m[k])}
let bgFlip=false;
function setBackground(url){const next=$(bgFlip?'bgA':'bgB'),prev=$(bgFlip?'bgB':'bgA');next.style.backgroundImage=`url(${url})`;next.classList.add('on');prev.classList.remove('on');bgFlip=!bgFlip}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function swapAct(act){document.body.classList.add('swapping');await sleep(450);renderAct(act);await sleep(60);document.body.classList.remove('swapping')}
function renderAct(act){
  S.actId=act.id;labels=act.labels||{};S.lang=act.lang||'en';applyTheme(act.theme);applyLang(S.lang);
  setBackground(`/art.png?v=${act.id}`);$('art').src=`/art.png?v=${act.id}`;
  $('kick').textContent=act.kicker||'';S.actPlace=act.place||'';S.actDate=act.date||'';document.title=act.title||document.title;
  for(const z of ['tl','tr','bottom'])$('z-'+z).innerHTML=(act.captions||[]).filter(c=>c.zone===z).map((c,i)=>`<div class="cap" ${c.dot?`data-dot="${c.dot}"`:''} style="animation-delay:${i*90}ms"><b>${esc(c.title)}</b><small>${esc(c.text||'')}</small></div>`).join('');
  drawLines();
}
function drawLines(){const st=$('stage'),r0=st.getBoundingClientRect();if(!r0.width)return;const k=r0.width/1672,svg=$('lines');svg.setAttribute('viewBox',`0 0 ${r0.width} ${r0.height}`);svg.innerHTML='';
 st.querySelectorAll('.cap[data-dot]').forEach(c=>{const[x,y]=c.dataset.dot.split(',').map(v=>v*k),r=c.getBoundingClientRect(),rx=r.left-r0.left,ry=r.top-r0.top,ax=Math.min(Math.max(x,rx),rx+r.width),ay=Math.min(Math.max(y,ry),ry+r.height);svg.insertAdjacentHTML('beforeend',`<line x1="${x}" y1="${y}" x2="${ax}" y2="${ay}"/><circle cx="${x}" cy="${y}" r="6"/>`)})}
addEventListener('resize',drawLines);

// ---- turn: story, options, panels ----
const story=$('story');
function pageW(){const c=getComputedStyle(story);return story.clientWidth-parseFloat(c.paddingLeft)-parseFloat(c.paddingRight)+parseFloat(c.columnGap)}
function pgUpd(){const w=pageW();$('pg').textContent=(Math.round(story.scrollLeft/w)+1)+'/'+(Math.round((story.scrollWidth-story.clientWidth)/w)+1)}
function go(d){story.scrollBy({left:d*pageW()});setTimeout(pgUpd,500)}
$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);
function renderTurn(t){
  S.turnId=t.id;
  story.style.scrollBehavior='auto';story.scrollLeft=0;story.style.scrollBehavior='';
  story.innerHTML=t.blocks.map((b,i)=>b.replace(/^<(\w+)/,`<$1 style="animation-delay:${i*160}ms"`)).join('');
  setTimeout(pgUpd,900);
  $('q').textContent=t.question||'';
  $('opts').innerHTML=(t.options||[]).map((o,i)=>`<button class="opt" style="animation-delay:${400+i*120}ms" data-i="${i}"><i>${i+1}</i>${esc(o)}</button>`).join('');
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>sendAction('button',`${+b.dataset.i+1}. ${t.options[+b.dataset.i]}`));
  S.panelsKey=JSON.stringify(t.panels||[]);S.panelsHtml=buildPanels(t.panels||[]);
  renderSide();
}
function buildPanels(panels){
  return (panels||[]).map(p=>`<div class="box"><h5>${esc(p.title)}</h5>`+
    (p.chips?`<div class="chips">${p.chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div>`:'')+
    (p.bars||[]).map(b=>`<div class="bar-row"><span>${esc(b.label)}</span><div><i style="width:${Math.min(100,b.value/b.max*100)}%"></i></div><b>${b.value}</b></div>`).join('')+
    (p.steps?`<div class="steps">${p.steps.map(s=>`<div class="step ${s.current?'cur':''}">${esc(s.label)}</div>`).join('')}</div>`:'')+`</div>`).join('');
}

// ---- heroes: updated in place, numbers flash and bars glide ----
function heroList(v){
  const out=[];const c=v&&v.character;
  if(c)out.push({id:c.id||'pc',name:c.name,sub:[c.race,c.class].filter(Boolean).join(' · ')+(c.level?` · ${t('lvl')} ${c.level}`:''),hp:c.hp&&c.hp.current,hpMax:c.hp&&c.hp.max,ac:c.ac,stats:c.stats,skills:c.skills,money:c.money&&c.money.formatted});
  for(const p of (v&&v.npcs&&v.npcs.party)||[]){const s=p.character_sheet||{};out.push({id:p.id,name:p.name,sub:[s.race,s.class].filter(Boolean).join(' · ')+(s.level?` · ${t('lvl')} ${s.level}`:''),hp:s.hp,hpMax:s.hp_max,ac:s.ac,stats:s.stats,skills:s.skills})}
  return out;
}
function renderSide(){
  const side=$('side');let keep=Object.keys(S.heroes).join('|');
  const heroes=heroList(S.views);
  const cm=S.views&&S.views.character&&S.views.character.money,purse=cm?cm.formatted:'—';
  const panelsNow=(S.panelsHtml||'').split('{money}').join(esc(purse));
  if(keep!==heroes.map(h=>h.id).join('|')||side.dataset.panels!==panelsNow){
    S.heroes={};
    side.innerHTML=heroes.map(h=>`<section class="hero" data-id="${esc(h.id)}"><h3>${esc(h.name)}</h3><div class="sub">${esc(h.sub)}</div>
      <div class="hp"><div class="bar"><i></i></div><span><span data-f="hp"></span>/<span data-f="hpMax"></span> · ${t('ac')} <span data-f="ac"></span>${h.money?` · 💰 <span data-f="money"></span>`:''}</span></div>
      ${h.stats?`<div class="abs">${ABIL().map(([k,l])=>`<div class="ab"><em>${l}</em><b data-s="${k}"></b><u data-m="${k}"></u></div>`).join('')}</div>`:''}
      <div class="chips" data-f="skills"></div></section>`).join('')+panelsNow+questsHtml();
    side.dataset.panels=panelsNow;
    heroes.forEach(h=>S.heroes[h.id]=side.querySelector(`[data-id="${CSS.escape(h.id)}"]`));
  }
  for(const h of heroes){const el=S.heroes[h.id];if(!el)continue;
    setText(el.querySelector('[data-f=hp]'),h.hp??'?');setText(el.querySelector('[data-f=hpMax]'),h.hpMax??'?');setText(el.querySelector('[data-f=ac]'),h.ac??'—');if(h.money)setText(el.querySelector('[data-f=money]'),h.money);
    el.querySelector('.bar i').style.width=(h.hpMax?Math.max(0,Math.min(100,100*h.hp/h.hpMax)):100)+'%';
    if(h.stats)for(const k of ABIL_KEYS){const b=el.querySelector(`[data-s=${k}]`),m=el.querySelector(`[data-m=${k}]`);if(b){setText(b,h.stats[k]);setText(m,mod(h.stats[k]))}}
    const sk=Object.entries(h.skills||{}).map(([k,v])=>`<span class="chip">${esc(skillName(k))} <b>+${typeof v==='object'?v.total:v}</b></span>`).join('');
    const holder=el.querySelector('[data-f=skills]');if(holder.dataset.h!==sk){holder.innerHTML=sk;holder.dataset.h=sk}}
}
function questsHtml(){const q=((S.views&&S.views.quests)||[]).filter(x=>x.status!=='completed'&&x.status!=='failed').slice(0,4);if(!q.length)return'';
  return `<div class="box"><h5>${t('quests')}</h5>${q.map(x=>{const o=x.objectives||[],d=o.filter(y=>y.done).length;return `<div class="quest-row">${esc(x.name)} <small>${o.length?`${d}/${o.length}`:''}</small></div>`}).join('')}</div>`}

// ---- the Master's visible work ----
const ICON={think:'🧠',roll:'🎲',save:'💾',world:'🌍',info:'•'};
function renderFeed(list){
  const box=$('feedlist');
  for(const e of list){if(e.id<=S.feedLast)continue;S.feedLast=e.id;
    const d=document.createElement('div');d.className='fi '+e.kind;
    d.innerHTML=`<span class="ic">${e.kind==='roll'?'<span class="dice">🎲</span>':ICON[e.kind]||'•'}</span><span class="t">${esc(e.kind==='roll'?e.text.replace(/^🎲\s*/,''):e.text)}</span>`;box.appendChild(d)}
  while(box.children.length>8)box.removeChild(box.firstChild);
  let th=box.querySelector('.think-now');
  if(S.waiting&&!th){th=document.createElement('div');th.className='fi think think-now';th.innerHTML=`<span class="ic">🧠</span><span class="t">${t('think')}<span class="dots"></span></span>`;box.appendChild(th)}
  if(!S.waiting&&th)th.remove();
}

// ---- state from the server ----
let reloadWanted=false;
const busyNow=()=>(rec&&rec.state==='recording')||$('say').classList.contains('on')||$('mic').classList.contains('busy')||($('txt').value&&document.activeElement===$('txt'));
setInterval(()=>{if(reloadWanted&&!busyNow())location.reload()},1500);
function showClock(st){$('place').textContent=S.actPlace||(st.clock&&st.clock.location)||'';$('date').textContent=(st.clock&&st.clock.text)||S.actDate||''}
function onState(st){
  if(S.build&&st.build&&st.build!==S.build)reloadWanted=true;
  else S.build=st.build||S.build;
  S.views=st.views;
  if(st.act&&st.act.id!==S.actId){if(S.actId===null)renderAct(st.act);else swapAct(st.act)}
  if(st.turn&&st.turn.id!==S.turnId){S.waiting=false;renderTurn(st.turn)}
  else if(st.turn&&JSON.stringify(st.turn.panels||[])!==S.panelsKey){S.panelsKey=JSON.stringify(st.turn.panels||[]);S.panelsHtml=buildPanels(st.turn.panels||[]);renderSide()}
  else renderSide();
  if(st.turn){S.waiting=S.waiting||(st.inbox_last>(st.turn.answered||0))}
  document.body.classList.toggle('waiting',S.waiting);
  showClock(st);
  renderWho();renderFeed(st.activity||[]);
}
function connect(){const es=new EventSource('/api/events?token='+encodeURIComponent(TOKEN));
  es.addEventListener('state',e=>{$('live').classList.add('on');onState(JSON.parse(e.data))});
  es.onerror=()=>{$('live').classList.remove('on');probe()}}
let probing=false;
function probe(){if(probing)return;probing=true;const tick=()=>fetch('/api/state',{headers:{'X-Screen-Token':TOKEN}}).then(r=>{probing=false;if(r.status===403)reloadWanted=true;else if(r.ok)setTimeout(()=>{if(!$('live').classList.contains('on'))reloadWanted=true},2500);else setTimeout(()=>{probing=false;probe()},2000)}).catch(()=>setTimeout(tick,2000));tick()}
fetch('/api/state',{headers:{'X-Screen-Token':TOKEN}}).then(r=>r.json()).then(onState).catch(e=>document.body.setAttribute('data-err',String(e&&e.stack||e)));
if(!location.search.includes('nosse'))connect();

// ---- sending actions ----
function renderWho(){const names=[];const c=S.views&&S.views.character;if(c)names.push(c.name.split(' ')[0]);
  for(const p of (S.views&&S.views.npcs&&S.views.npcs.party)||[])names.push(p.name.split(' ')[0]);names.push(t('all'));
  const key=names.join('|');if($('who').dataset.k===key)return;$('who').dataset.k=key;
  if(!names.includes(S.who))S.who=t('all');
  $('who').innerHTML=names.map(n=>`<button data-n="${esc(n)}" class="${n===S.who?'on':''}">${esc(n)}</button>`).join('');
  $('who').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.who=b.dataset.n;try{localStorage.setItem('who',S.who)}catch(e){}$('who').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))})}
async function sendAction(source,text){
  text=(text||'').trim();if(!text)return false;
  const r=await fetch('/api/action',{method:'POST',headers:{'X-Screen-Token':TOKEN,'Content-Type':'application/json'},body:JSON.stringify({who:S.who,source,text})});
  if(!r.ok){toast(t('fail')+((await r.json()).error||r.status));return false}
  S.waiting=true;document.body.classList.add('waiting');renderFeed([]);toast(t('sent')+text);$('txt').value='';return true}
$('send').onclick=()=>sendAction('text',$('txt').value);
$('txt').addEventListener('keydown',e=>{if(e.key==='Enter')sendAction('text',$('txt').value)});

// ---- microphone: record, transcribe, show, send ----
let started=0,rec=null,chunks=[],stream=null,countdown=null,pending='';
const SAY_MS=4000;let sayLeft=0;
const sayHeld=()=>$('say').matches(':hover')||$('sayin').style.display==='block';
function showSay(text){pending=text;$('saytx').textContent='«'+text+'»';$('sayin').style.display='none';$('saytx').style.display='block';$('say').classList.add('on');
  sayLeft=SAY_MS;$('saycd').style.width='100%';clearInterval(countdown);
  countdown=setInterval(()=>{if(!$('say').classList.contains('on')){clearInterval(countdown);return}
    const held=sayHeld();$('say').classList.toggle('paused',held);
    if(!held){sayLeft-=50;$('saycd').style.width=Math.max(0,sayLeft/SAY_MS*100)+'%';if(sayLeft<=0)finishSay(true)}},50)}
function finishSay(send){clearInterval(countdown);const t=$('sayin').style.display==='block'?$('sayin').value:pending;$('say').classList.remove('on');if(send)sendAction('voice',t)}
$('saygo').onclick=()=>finishSay(true);$('saycancel').onclick=()=>finishSay(false);
$('sayedit').onclick=()=>{$('saytx').style.display='none';const i=$('sayin');i.value=pending;i.style.display='block';i.focus()};
$('sayin').addEventListener('keydown',e=>{if(e.key==='Enter')finishSay(true)});
$('mic').onclick=async()=>{
  const mic=$('mic');
  if(rec&&rec.state==='recording'){rec.stop();return}
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){toast(t('noMic'));return}
  const type=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'';
  rec=new MediaRecorder(stream,type?{mimeType:type}:{});chunks=[];
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());mic.classList.remove('rec');
    if(Date.now()-started<500){mic.textContent='🎤';toast(t('short'));return}
    mic.classList.add('busy');mic.textContent='…';
    try{const r=await fetch('/api/voice',{method:'POST',headers:{'X-Screen-Token':TOKEN,'Content-Type':rec.mimeType||'audio/webm'},body:new Blob(chunks,{type:rec.mimeType})});
      const j=await r.json();if(!r.ok)toast(j.error||t('notUnderstood'));else if(!j.text)toast(t('silence'));else showSay(j.text)}
    catch(e){toast(t('noNet'))}
    mic.classList.remove('busy');mic.textContent='🎤'};
  started=Date.now();rec.start();mic.classList.add('rec');mic.textContent='■';toast(t('speak'))};

// ---- picture mode ----
const setPicText=()=>{$('pic').textContent=document.body.classList.contains('clear')?t('picBack'):t('pic')};
const tgPic=()=>{document.body.classList.toggle('clear');setPicText();setTimeout(drawLines,60)};
$('pic').onclick=tgPic;
const setCapsText=()=>{$('caps').textContent=t('caps')+': '+t(document.body.classList.contains('nocaps')?'off':'on')};
$('caps').onclick=()=>{document.body.classList.toggle('nocaps');setCapsText()};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='h'||e.key==='H')tgPic();if(e.key==='f'||e.key==='F')document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
</script></body></html>
